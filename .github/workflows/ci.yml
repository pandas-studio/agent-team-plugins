name: CI

on:
  push:
  pull_request:

env:
  # Base for scripts/check-version-bump.py (#151): the PR's base branch; on a
  # push to main, the previous tip, so a multi-commit push is checked whole;
  # on any other push, origin/main.
  VERSION_BUMP_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.ref == 'refs/heads/main' && github.event.before) || 'origin/main' }}
  # A push to main compares with that previous tip itself, not a merge base,
  # so a force push that rolls a version back cannot pass.
  VERSION_BUMP_DIRECT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version-bump check needs the base branch and the merge base.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      # jq ships on ubuntu-latest; shellcheck does not.
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: uv sync --directory runtime --frozen --python 3.12 --extra dev
      - run: bash scripts/check.sh
        env:
          CI: "true"

  # dev-trio refuses native Windows shells with a WSL hint (lib/host.sh). This
  # runs the real wrapper in Git Bash, where the refusal was measured;
  # scripts/check.sh itself needs macOS or Linux.
  windows-refusal:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: ask-reviewer.sh exits 2 with the WSL hint before any model call
        run: |
          uname -s
          stub="$RUNNER_TEMP/reviewer"
          printf '#!/bin/sh\necho called >> "%s/calls"\n' "$RUNNER_TEMP" > "$stub"
          chmod +x "$stub"
          rc=0
          env AGENT_TEAM=windows-ci TMUX='' DEV_TRIO_REVIEWER_MODEL=codex \
            CODEX_CLI="$stub" AGENT_TEAM_MODELS_CONFIG="$RUNNER_TEMP/no-models.json" \
            DEV_TRIO_LOG_DIR="$RUNNER_TEMP/log" \
            bash dev-trio/bin/ask-reviewer.sh 'windows refusal' < /dev/null 2> err.txt || rc=$?
          cat err.txt
          [ "$rc" = 2 ] || { echo "want rc 2, got $rc" >&2; exit 1; }
          grep -F 'native Windows shells (Git Bash, MSYS2, Cygwin) are not supported; run Claude Code inside WSL' err.txt
          [ ! -e "$RUNNER_TEMP/calls" ] || { echo 'the reviewer stub was called' >&2; exit 1; }
          [ ! -e "$RUNNER_TEMP/log" ] || { echo 'a log directory was created' >&2; exit 1; }

  # macOS catches what the Ubuntu job cannot: bash 3.2, BSD userland, and the
  # darwin-only tests (#153). /bin/bash is 3.2 there, but the runner image puts
  # Homebrew's bash 5 first on PATH, so a shim dir makes every `bash` and
  # `#!/usr/bin/env bash` resolve to /bin/bash.
  macos:
    runs-on: macos-latest
    # A local full run took 12-25 min depending on load; cap a hung run.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/check.sh runs the version-bump check (#151), which needs
          # the base branch and the merge base.
          fetch-depth: 0
      # Pin python3 for the non-runtime suites; otherwise it is whatever the
      # image ships first on PATH.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: brew install shellcheck
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
      - name: Put /bin/bash (3.2) first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - name: Check bash is 3.2
        run: |
          command -v bash
          v="$(bash -c 'echo "${BASH_VERSINFO[0]}"')"
          [ "$v" = 3 ] || { echo "bash on PATH is $v, want 3" >&2; exit 1; }
          python3 --version
      - run: uv sync --directory runtime --frozen --python 3.12 --extra dev
      # The step shares one process group with hosted-compute-agent,
      # Runner.Listener and Runner.Worker. Unisolated, check.sh lost the runner
      # (no log, timeout-minutes never fired) whenever debate.sh's stop_attempt,
      # driven by two tests in test_debate_conductor_hosts, sent TERM to the
      # attempt it had stopped; no signal went to a runner process, and why the
      # runner went down is not known (#174; runs 36503223500 topology,
      # 36512979478 bisect, 36516295519 and 36517682066 signals, 36519413756
      # orders, 36521255542 the fix unisolated). stop_attempt now resumes before
      # it terminates; this session keeps any other group-wide effect off the
      # runner.
      # `exec` keeps the step's PID on check.sh, so a timeout's signal reaches
      # it; its descendants go with the hosted runner's VM at job end.
      - name: Run scripts/check.sh in its own session
        run: >-
          exec python3 -c 'import os;
          os.setsid();
          print("check.sh pid", os.getpid(), "pgid", os.getpgid(0), "sid", os.getsid(0), flush=True);
          os.execv("/bin/bash", ["/bin/bash", "scripts/check.sh"])'
        timeout-minutes: 40
        env:
          CI: "true"
