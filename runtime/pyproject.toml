[project]
name = "agent-team-graph"
version = "0.1.0"
description = "Durable LangGraph control plane for agent-team-plugins"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.2.9,<1.3",
    "langgraph-checkpoint-sqlite>=3.1,<4",
]

[project.scripts]
agent-team-graph = "agent_team_graph.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_team_graph"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
